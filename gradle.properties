org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false
# File-system watching can fail inside restricted environments; the build does not need it.
org.gradle.vfs.watch=false
# Keep timeouts short so an unreachable repository fails fast instead of hanging.
org.gradle.internal.http.connectionTimeout=15000
org.gradle.internal.http.socketTimeout=30000

# Minecraft / Forge
minecraft_version=1.20.1
forge_version=47.4.5
minecraft_version_range=[1.20.1,1.21)
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod metadata
mod_id=audio-pool-guard
mod_name=Audio Pool Guard
mod_license=LGPL-3.0
mod_version=1.0.0
mod_group_id=com.mattymatty.audio_priority
mod_authors=Htao-uu (Forge 1.20.1 port), mattymatty (original audio_engine_tweaks)
mod_description=Ignores excess sounds once the client sound pool is full, and repairs the SoundEngine soundDeleteTime lookup that otherwise NPEs the client. Stripped Forge port of the audio_engine_tweaks pool guard (mattymatty, LGPL-3.0).
