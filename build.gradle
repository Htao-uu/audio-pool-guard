// Two optional file:// repositories are used for fully offline builds:
//   <project>/local-maven                                        - the Gradle artifact cache laid out as a Maven repo
//                                                                  (generated by tools/offline-build-setup.ps1)
//   <workspace>/.gradle-home/caches/forge_gradle/maven_downloader - ForgeGradle's own download cache (already a
//                                                                  Maven layout; holds forge-*-userdev.jar and mcp_config)
// Both are skipped when the directory is absent, so a normal clone just uses the mirrors below.
buildscript {
    repositories {
        def localMaven = new File(rootDir, 'local-maven')
        if (localMaven.isDirectory()) {
            maven { url = localMaven.toURI() }
        }
        def forgeGradleDownloads = new File(rootDir, '../.gradle-home/caches/forge_gradle/maven_downloader')
        if (forgeGradleDownloads.isDirectory()) {
            maven { url = forgeGradleDownloads.toURI() }
        }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        // ForgeGradle 6.0.54 (the 1.20.1 MDK range is [6.0,6.2)).
        // Applied from the buildscript classpath instead of the plugins {} block: ForgeGradle is published
        // with a plugin marker, and resolving that marker needs the plugin portal.
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
        gameTestServer {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all'
        }
    }
}

repositories {
    // Same optional offline repositories as above; mirrors only kick in when they are absent.
    def localMaven = new File(rootDir, 'local-maven')
    if (localMaven.isDirectory()) {
        maven { url = localMaven.toURI() }
    }
    def forgeGradleDownloads = new File(rootDir, '../.gradle-home/caches/forge_gradle/maven_downloader')
    if (forgeGradleDownloads.isDirectory()) {
        maven { url = forgeGradleDownloads.toURI() }
    }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// ${...} placeholders inside mods.toml / pack.mcmeta are expanded from gradle.properties.
def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    forge_version          : forge_version,
    forge_version_range    : forge_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
]

processResources {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title"   : mod_id,
            "Implementation-Version": project.version,
        ])
    }
    // Reobfuscate the release jar from official mappings to SRG member names.
    finalizedBy 'reobfJar'
}
