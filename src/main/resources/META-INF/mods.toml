modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
# Client-only mod: never show a red X when the server/client mod lists differ.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
versionRange="${forge_version_range}"
mandatory=true
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true
ordering="NONE"
side="CLIENT"

# Forge 1.20.1 loads mixin configurations through the [[mixins]] block of mods.toml.
[[mixins]]
config="audio_pool_guard.mixins.json"
